[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolab-mcp"
version = "0.4.0"
description = "Local-first scientific evidence workspace with auditable retrieval, monitoring, and provenance"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Srikar Jy", email = "srikarjy025@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.1",
    "defusedxml>=0.7.1",
    "typer>=0.12",
    "rich>=13.7",
    "starlette>=0.27",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
server = [
    "mcp[cli]>=1.28",
]
turso = [
    "libsql>=0.1.11",
]

[project.entry-points]
console_scripts = { biolab = "biolab.cli:main" }

[project.urls]
Homepage = "https://github.com/srikarjy/biolab-mcp-server"
Repository = "https://github.com/srikarjy/biolab-mcp-server"
Issues = "https://github.com/srikarjy/biolab-mcp-server/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["biolab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "benchmark: performance benchmark (needs pytest-benchmark; excluded from CI, run manually with -m benchmark)",
    "live: requires public network access or local socket binding",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["biolab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "PL", "TRY", "SIM", "T20"]
ignore = [
    "E501",
    "TRY003",
    "PTH123",
    "PLC0415",  # lazy imports are deliberate: optional deps loaded per-command, not at CLI startup
    "PLR2004",  # small literal thresholds (page sizes, cap checks, test assertion counts) read fine inline
    "PLW0602",  # the writer thread is intentional module-level state — see retrieval_log.py
    "PLW0603",
    "PLR0913",  # write_retrieval's 8 args mirror the retrievals table 1:1 — a kwargs dict would hide the schema
    "PLR0917",
    "T201",     # migrations/001_v2_schema.py is a one-shot CLI script; print is its UI
    "B008",     # typer.Argument()/typer.Option() in defaults is the typer-idiomatic pattern
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
