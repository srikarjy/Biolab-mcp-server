services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: biolab
      POSTGRES_USER: biolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for local pgvector}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biolab -d biolab"]
      interval: 2s
      timeout: 3s
      retries: 15
